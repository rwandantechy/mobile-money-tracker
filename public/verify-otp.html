<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify OTP - Money Tracker</title>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</head>
<body>
  <div class="container">
    <header class="landing-header">
      <h1><i class="fas fa-wallet"></i> Money Tracker</h1>
      <div class="user-section">
        <p id="userInfo">Welcome, Guest</p>
        <button id="logoutBtn" class="logout-btn hidden">Logout</button>
        <div class="profile-circle">
          <img src="https://innocentn.vercel.app/images/profile-pic.png" alt="Profile"/>
        </div>
      </div>
    </header>

    <main>
      <section class="auth-section verify-section page-section">
        <h2><i class="fas fa-shield-alt"></i> Verify OTP</h2>
        <p class="auth-message">Please enter the 6-digit code sent to your email</p>

        <form id="verifyOtpForm">
          <!-- Hidden email field filled via JavaScript from URL -->
          <input type="hidden" id="email" name="email" value=""/>

          <div class="otp-container" role="group" aria-label="OTP Verification Code">
            <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-input" required />
            <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-input" required />
            <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-input" required />
            <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-input" required />
            <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-input" required />
            <input type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" class="otp-input" required />
          </div>

          <div class="timer-container">
            <p>Code expires in: <span id="timer">05:00</span></p>
          </div>

          <button type="submit" class="btn-submit">
            <i class="fas fa-check-circle"></i> Verify
          </button>
        </form>

        <div class="auth-links">
          <p class="auth-link">
            Didn't receive the code? <a href="#" id="resendOtp">Resend OTP</a>
          </p>
          <p class="auth-link">
            <a href="login.html">Back to Login</a>
          </p>
        </div>
      </section>
    </main>
  </div>

  <script>
    // Populate hidden email input from URL
    const params = new URLSearchParams(window.location.search);
    const emailParam = params.get('email');
    if (emailParam) {
      document.getElementById('email').value = emailParam;
    }
  </script>
  <script src="auth.js"></script>
</body>
</html>
