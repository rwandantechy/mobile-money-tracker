<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset - Money Tracker Pro</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="landing-header">
            <div class="header-content">
                <div class="logo-section">
                    <h1>
                        <a href="index.html" class="logo-link" style="text-decoration:none; color:inherit; display:flex; align-items:center; gap:0.75rem;">
                            <i class="fas fa-wallet" aria-hidden="true"></i>
                            <span class="logo-text">Money Tracker <span class="pro-badge">Pro</span></span>
                        </a>
                    </h1>
                    <p class="tagline">Professional Mobile Money Management</p>
                </div>
                <nav class="user-section" aria-label="User menu">
                    <span id="userInfo" class="welcome-text">Welcome, Guest</span>
                    <button id="logoutBtn" class="logout-btn hidden">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Logout</span>
                    </button>
                    <div class="profile-dropdown-container">
                        <button id="profileIcon" class="profile-icon-btn" aria-haspopup="true" aria-expanded="false" aria-label="Profile options">
                            <i class="fas fa-user-circle"></i>
                        </button>
                        <nav id="profileDropdown" class="profile-dropdown" aria-label="Profile menu">
                            <a href="/profile.html">
                                <i class="fas fa-user"></i>
                                View Profile
                            </a>
                            <a href="/settings.html">
                                <i class="fas fa-cog"></i>
                                Settings
                            </a>
                            <a href="/logout" class="logout-link">
                                <i class="fas fa-sign-out-alt"></i>
                                Logout
                            </a>
                        </nav>
                    </div>
                </nav>
            </div>
        </header>

        <main>
            <section class="auth-section reset-section">
                <div class="auth-header">
                    <div class="auth-icon">
                        <i class="fas fa-key"></i>
                    </div>
                    <h2>Reset Your Password</h2>
                    <p class="auth-subtitle">Enter your email to receive a reset link</p>
                </div>
                
                <form id="resetForm" class="auth-form">
                    <div class="form-group">
                        <label for="email">
                            <i class="fas fa-envelope"></i>
                            Email Address
                        </label>
                        <input type="email" id="email" name="email" required placeholder="Enter your registered email">
                    </div>

                    <button type="submit" class="btn-submit">
                        <i class="fas fa-paper-plane"></i>
                        <span>Send Reset Link</span>
                    </button>
                </form>

                <div class="auth-footer">
                    <p class="auth-link">
                        Remember your password? <a href="login.html">Sign in here</a>
                    </p>
                </div>
            </section>
        </main>
    </div>
    <script src="auth.js"></script>
</body>
</html>
