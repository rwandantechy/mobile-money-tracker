<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Mobile Money Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
        <header class="landing-header">
            <h1><i class="fas fa-wallet"></i> Money Tracker</h1>
            <div class="user-section">
              <p id="userInfo">Welcome, Guest</p>
              <button id="logoutBtn" class="logout-btn hidden">Logout</button>
              <div class="profile-circle">
                <img src="https://innocentn.vercel.app/images/profile-pic.png" alt="Profile" />
              </div>
            </div>
        </header>

        <main>
            <section class="auth-section register-section page-section">
                <h2>Register</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="fullName">Full Name:</label>
                        <input type="text" id="fullName" name="fullName" required />
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required />
                    </div>

                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required minlength="6" />
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password:</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" />
                    </div>

                    <button type="submit" class="btn-submit">Register</button>
                </form>

                <p class="auth-link">
                    Already have an account? <a href="login.html">Login here</a>
                </p>
            </section>
        </main>
    </div>
    <script src="auth.js"></script>
  </body>
</html>
