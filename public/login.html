<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Money Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="landing-header">
            <h1><i class="fas fa-wallet"></i> Money Tracker</h1>
            <div class="user-section">
                <p id="userInfo">Welcome, Guest</p>
                <button id="logoutBtn" class="logout-btn hidden">Logout</button>
                <div class="profile-circle">
                    <img src="https://innocentn.vercel.app/images/profile-pic.png" alt="Profile" />
                </div>
            </div>
        </header>

        <main>
            <section class="auth-section login-section page-section">
                <h2><i class="fas fa-sign-in-alt"></i> Login</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username"><i class="fas fa-user"></i> Username:</label>
                        <input type="text" id="username" name="username" required>
                    </div>

                    <div class="form-group">
                        <label for="password"><i class="fas fa-lock"></i> Password:</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <button type="submit" class="btn-submit">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </form>

                <p class="auth-link">
                    Don't have an account? <a href="register.html">Register here</a>
                </p>
            </section>
        </main>
    </div>
    <script src="auth.js"></script>
</body>
</html>
