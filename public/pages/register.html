<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Money Tracker Pro</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="container">
        <header class="landing-header">
            <div class="header-content">
                <div class="logo-section">
                    <h1>
                        <a href="index.html" class="logo-link" style="text-decoration:none; color:inherit; display:flex; align-items:center; gap:0.75rem;">
                            <i class="fas fa-wallet" aria-hidden="true"></i>
                            <span class="logo-text">Money Tracker <span class="pro-badge">Pro</span></span>
                        </a>
                    </h1>
                    <p class="tagline">Professional Mobile Money Management</p>
                </div>
                <nav class="user-section" aria-label="User menu">
                    <span id="userInfo" class="welcome-text">Welcome, Guest</span>
                    <button id="logoutBtn" class="logout-btn hidden">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Logout</span>
                    </button>
                    <div class="profile-dropdown-container">
                        <button id="profileIcon" class="profile-icon-btn" aria-haspopup="true" aria-expanded="false" aria-label="Profile options">
                            <i class="fas fa-user-circle"></i>
                        </button>
                        <nav id="profileDropdown" class="profile-dropdown" aria-label="Profile menu">
                            <a href="/profile.html">
                                <i class="fas fa-user"></i>
                                View Profile
                            </a>
                            <a href="/settings.html">
                                <i class="fas fa-cog"></i>
                                Settings
                            </a>
                            <a href="/logout" class="logout-link">
                                <i class="fas fa-sign-out-alt"></i>
                                Logout
                            </a>
                        </nav>
                    </div>
                </nav>
            </div>
        </header>

        <main>
            <section class="auth-section register-section">
                <div class="auth-header">
                    <div class="auth-icon">
                        <i class="fas fa-user-plus"></i>
                    </div>
                    <h2>Create Your Account</h2>
                    <p class="auth-subtitle">Join thousands of mobile money professionals</p>
                </div>
                
                <form id="registerForm" class="auth-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">
                                <i class="fas fa-user"></i>
                                First Name
                            </label>
                            <input type="text" id="firstName" name="firstName" required placeholder="Enter your first name">
                        </div>
                        <div class="form-group">
                            <label for="lastName">
                                <i class="fas fa-user"></i>
                                Last Name
                            </label>
                            <input type="text" id="lastName" name="lastName" required placeholder="Enter your last name">
                        </div>
                    </div>

                    <div class="email-phone-row">
                        <div class="form-group">
                            <label for="email">
                                <i class="fas fa-envelope"></i>
                                Email Address
                            </label>
                            <input type="email" id="email" name="email" required placeholder="Enter your email address">
                        </div>
                        <div class="form-group">
                            <label for="phone">
                                <i class="fas fa-phone"></i>
                                Phone Number
                            </label>
                            <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">
                            <i class="fas fa-lock"></i>
                            Password
                        </label>
                        <input type="password" id="password" name="password" required placeholder="Create a strong password">
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">
                            <i class="fas fa-lock"></i>
                            Confirm Password
                        </label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password">
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="agreeTerms" required>
                            <span class="checkmark"></span>
                            I agree to the <a href="#" class="terms-link">Terms of Service</a> and <a href="#" class="terms-link">Privacy Policy</a>
                        </label>
                    </div>

                    <button type="submit" class="btn-submit">
                        <i class="fas fa-user-plus"></i>
                        <span>Create Account</span>
                    </button>
                </form>

                <div class="auth-divider">
                    <span>or</span>
                </div>

                <div class="social-auth">
                    <button class="social-btn google-btn">
                        <i class="fab fa-google"></i>
                        <span>Sign up with Google</span>
                    </button>
                </div>

                <div class="auth-footer">
                    <p class="auth-link">
                        Already have an account? <a href="login.html">Sign in here</a>
                    </p>
                </div>
            </section>
        </main>
    </div>
    <script src="/js/auth.js"></script>
  </body>
</html>
