<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Money Tracker Pro</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="landing-header">
            <div class="header-content">
                <div class="logo-section">
                    <h1>
                        <a href="/" class="logo-link">
                            <i class="fas fa-wallet" aria-hidden="true"></i>
                            <span class="logo-text">Money Tracker <span class="pro-badge">Pro</span></span>
                        </a>
                    </h1>
                    <p class="tagline">Professional Mobile Money Management</p>
                </div>
                <nav class="user-section" aria-label="User menu">
                    <div id="authButtons" class="auth-buttons">
                        <a href="/login" class="btn btn-outline">Back to Login</a>
                    </div>
                    <div id="userInfo" class="user-info" style="display: none;">
                        <span class="welcome-text">Welcome, <span id="userName">User</span></span>
                    </div>
                    <div class="profile-dropdown-container" id="profileDropdownContainer" style="display: none;">
                        <button id="profileIcon" class="profile-icon-btn" aria-haspopup="true" aria-expanded="false" aria-label="Profile options">
                            <i class="fas fa-user-circle"></i>
                        </button>
                        <nav id="profileDropdown" class="profile-dropdown" aria-label="Profile menu">
                            <a href="/dashboard">
                                <i class="fas fa-tachometer-alt"></i>
                                Dashboard
                            </a>
                            <a href="/profile">
                                <i class="fas fa-user"></i>
                                View Profile
                            </a>
                            <a href="/settings">
                                <i class="fas fa-cog"></i>
                                Settings
                            </a>
                            <a href="/logout" class="logout-link">
                                <i class="fas fa-sign-out-alt"></i>
                                Logout
                            </a>
                        </nav>
                    </div>
                </nav>
            </div>
        </header>

        <main>
            <section class="auth-section reset-section">
                <div class="auth-header">
                    <div class="auth-icon">
                        <i class="fas fa-key"></i>
                    </div>
                    <h2>Reset Your Password</h2>
                    <p class="auth-subtitle">Enter your new password below</p>
                </div>
                
                <form id="resetPasswordForm" class="auth-form">
                    <div class="form-group">
                        <label for="newPassword">
                            <i class="fas fa-lock"></i>
                            New Password
                        </label>
                        <input type="password" id="newPassword" name="newPassword" required minlength="6" placeholder="Enter your new password">
                    </div>

                    <div class="form-group">
                        <label for="confirmNewPassword">
                            <i class="fas fa-lock"></i>
                            Confirm New Password
                        </label>
                        <input type="password" id="confirmNewPassword" name="confirmNewPassword" required minlength="6" placeholder="Confirm your new password">
                    </div>

                    <button type="submit" class="btn-submit">
                        <i class="fas fa-save"></i>
                        <span>Reset Password</span>
                    </button>
                </form>

                <div class="auth-footer">
                    <p class="auth-link">
                        <a href="/login">
                            <i class="fas fa-arrow-left"></i>
                            Back to Login
                        </a>
                    </p>
                </div>
            </section>
        </main>
    </div>
    <script src="/js/auth.js"></script>
    <script src="/js/header.js"></script>
</body>
</html>
