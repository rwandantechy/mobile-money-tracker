<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Money Tracker</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="landing-header">
            <h1><i class="fas fa-wallet"></i> Money Tracker</h1>
            <div class="user-section">
                <p id="userInfo">Welcome, Guest</p>
                <button id="logoutBtn" class="logout-btn hidden">Logout</button>
                <div class="profile-circle">
                    <img src="https://innocentn.vercel.app/images/profile-pic.png" alt="Profile" />
                </div>
            </div>
        </header>

        <main>
            <section class="auth-section reset-section page-section">
                <h2><i class="fas fa-key"></i> Reset Password</h2>
                <p class="auth-message">Enter your new password below</p>
                <form id="resetPasswordForm">
                    <div class="form-group">
                        <label for="newPassword"><i class="fas fa-lock"></i> New Password:</label>
                        <input type="password" id="newPassword" name="newPassword" required minlength="6">
                    </div>

                    <div class="form-group">
                        <label for="confirmNewPassword"><i class="fas fa-lock"></i> Confirm New Password:</label>
                        <input type="password" id="confirmNewPassword" name="confirmNewPassword" required minlength="6">
                    </div>

                    <button type="submit" class="btn-submit">
                        <i class="fas fa-save"></i> Reset Password
                    </button>
                </form>

                <p class="auth-link">
                    <a href="/login">Back to Login</a>
                </p>
            </section>
        </main>
    </div>
    <script src="/js/auth.js"></script>
</body>
</html>
