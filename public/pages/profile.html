<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - Money Tracker Pro</title>
  <meta name="description" content="Manage your Money Tracker Pro profile, update personal information, and account settings">
  <meta name="keywords" content="profile, account settings, user management, mobile money tracker">
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="landing-header">
      <div class="header-content">
        <div class="logo-section">
          <h1>
            <a href="/" class="logo-link" style="text-decoration:none; color:inherit; display:flex; align-items:center; gap:0.75rem;">
              <i class="fas fa-wallet" aria-hidden="true"></i>
              <span class="logo-text">Money Tracker <span class="pro-badge">Pro</span></span>
            </a>
          </h1>
          <p class="tagline">Professional Mobile Money Management</p>
        </div>
        <nav class="user-section" aria-label="User menu">
          <span id="userInfo" class="welcome-text">Welcome, User</span>
          
          <div class="profile-dropdown-container">
            <button id="profileIcon" class="profile-icon-btn" aria-haspopup="true" aria-expanded="false" aria-label="Profile options">
              <i class="fas fa-user-circle"></i>
            </button>
            <nav id="profileDropdown" class="profile-dropdown" aria-label="Profile menu">
                          <!-- dashboard -->
              <a href="/app">
                <i class="fas fa-tachometer-alt"></i>
                Dashboard
              </a>
              
          
              <a href="/profile">
              <i class="fas fa-user"></i>
              View Profile
            </a>
            <a href="/settings">
              <i class="fas fa-cog"></i>
              Settings
            </a>
              <a href="/logout" class="logout-link">
                <i class="fas fa-sign-out-alt"></i>
                Logout
              </a>
            </nav>
          </div>
        </nav>
      </div>
    </header>
    <main>
      <section class="profile-section auth-section">
        <div class="auth-header">
          <div class="auth-icon profile-pic-container">
            <img id="profilePic" src="images/default-avatar.png" alt="Profile Picture" class="profile-pic" />
            <button id="changePicBtn" class="change-pic-btn" title="Change profile picture"><i class="fas fa-camera"></i></button>
          </div>
          <h2>Your Profile</h2>
          <p class="auth-subtitle">View and update your identity details</p>
        </div>
        <form id="profileForm" class="auth-form">
          <div class="form-row">
            <div class="form-group">
              <label for="fullName"><i class="fas fa-user"></i> Full Name</label>
              <input type="text" id="fullName" name="fullName" required placeholder="Enter your full name">
            </div>
            <div class="form-group">
              <label for="phone"><i class="fas fa-phone"></i> Phone</label>
              <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number" disabled>
            </div>
          </div>
          <div class="form-group">
            <label for="email"><i class="fas fa-envelope"></i> Email</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email" disabled>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="role"><i class="fas fa-user-tag"></i> Role</label>
              <input type="text" id="role" name="role" value="Merchant" disabled>
            </div>
            <div class="form-group verification-status">
              <label><i class="fas fa-check-circle"></i> Verification Status</label>
              <span id="verificationStatus" class="verified">Verified</span>
            </div>
          </div>
          <button type="submit" class="btn-submit">
            <i class="fas fa-save"></i>
            <span>Update Profile</span>
          </button>
        </form>
        <div class="danger-zone">
          <h3>Danger Zone</h3>
          <button id="deleteAccountBtn" class="btn-danger">
            <i class="fas fa-trash"></i>
            Delete Account
          </button>
        </div>
      </section>
    </main>
  </div>
  <script src="/js/profile.js"></script>
  <script src="/js/dropdown.js"></script>
</body>
</html>
